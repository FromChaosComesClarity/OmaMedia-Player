# OmaMedia-Player — mpv profile for a composite-fed CRT at 720x480 / 480i.
#
# Shares its reasoning with OmaDVD-Player, whose docs/DESIGN.md explains each
# choice at length. The differences from that profile are all consequences of
# playing *files* rather than a disc, and are called out below.

# ── Output ───────────────────────────────────────────────────────────────────
vo=gpu
gpu-api=opengl
fullscreen=yes
border=no
# No VAAPI driver is installed on the target machine, so "auto" only buys a
# failed probe and log noise. SD content is a few percent of one core.
hwdec=no

# ── Aspect ───────────────────────────────────────────────────────────────────
# A 720x480 framebuffer shown as 4:3 has non-square pixels (PAR 8:9). mpv
# assumes square pixels, so it would "correct" 4:3 content to 640x480 and
# pillarbox it, after which the tube stretches that back out too wide.
# omaplay.lua cancels this at runtime -- the disc's/file's true display aspect
# multiplied by 9/8 -- so this is left at the default here and the script is the
# single source of truth.
keepaspect=yes
video-aspect-method=container

# ── Scaling ──────────────────────────────────────────────────────────────────
# ⚠️ Unlike OmaDVD, this plays HD files on an SD screen, so the scaler actually
# runs -- and hard, because 1080p -> 480 is a 2.25x downscale on a Haswell iGPU.
# A cheap kernel with correct-downscaling off is what keeps that real-time.
scale=bilinear
dscale=bilinear
cscale=bilinear
correct-downscaling=no
sigmoid-upscaling=no
interpolation=no
deband=no
dither-depth=no

# ── Deinterlacing ────────────────────────────────────────────────────────────
# Off by default: most files are progressive, and broadcast captures that are
# not can be switched in the Picture menu (or with `d`).
deinterlace=no

# ── Audio ────────────────────────────────────────────────────────────────────
# Composite carries stereo. Without this a 5.1 track loses its centre channel,
# which is where the dialogue is.
audio-channels=stereo
# Music files with embedded art get a picture instead of a black screen.
# ⚠️ The values are no / embedded-first / external-first -- "attachment" is not
# one of them, and mpv rejects the whole line rather than ignoring it.
audio-display=embedded-first

# ── Subtitles ────────────────────────────────────────────────────────────────
# ⚠️ The opposite of OmaDVD, deliberately: a file often has a .srt beside it,
# and finding it is the whole point of sub-auto.
sub-auto=fuzzy
sub-font-size=44
sub-border-size=3
sub-color='#FFEDEAE2'
# Lift subtitles clear of the overscan the tube eats at the bottom.
sub-pos=92

# ── Behaviour ────────────────────────────────────────────────────────────────
keep-open=yes
idle=yes
# The browser lives in a window with no file loaded; without this mpv destroys
# that window and there is nothing left to draw on.
force-window=yes
osd-level=0
osd-bar=no
cursor-autohide=100
# ⚠️ Unlike OmaDVD, watch-later IS the right resume here: a file has a stable
# path to key on, where every DVD presents the identical "filename", dvdnav://.
save-position-on-quit=yes
