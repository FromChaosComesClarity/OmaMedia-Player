# OmaMedia-Player — extra key bindings.
#
# Navigation (arrows, Enter, Esc, Backspace, Space, q ...) is claimed by
# omaplay.lua with forced bindings, so one key does the obvious thing in the
# browser and during playback alike. Only additions live here.

9      add volume -5
0      add volume  5
CTRL+m cycle mute

# Coarse seeking for long files.
PGUP   seek  60
PGDWN  seek -60

# Frame-accurate nudging while paused.
.      frame-step
,      frame-back-step

# Subtitle timing, since a downloaded .srt is often a second out.
z      add sub-delay -0.1
Z      add sub-delay  0.1
